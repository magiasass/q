<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Quizzes</title>
<style>
:root{--bg:#fafafb;--card:#fff;--fg:#2e3436;--dim:#77767b;--line:#e0e0e3;--acc:#3584e4;--accfg:#fff;--ok:#26a269;--okbg:#e6f6ee;--bad:#e01b24;--badbg:#fdeaeb;--hover:#f0f0f2;--sh:0 1px 2px #0002;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#242424;--card:#303030;--fg:#fff;--dim:#9a9996;--line:#444;--acc:#78aeed;--accfg:#001a3a;--ok:#57e389;--okbg:#1d3a2b;--bad:#ff7b63;--badbg:#44241f;--hover:#3a3a3a}}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--fg);font:16px/1.45 Cantarell,"Adwaita Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:6px 8px;min-height:50px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
header h1{flex:1;font-size:1rem;font-weight:700;margin:0;text-align:center;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
main{max-width:640px;margin:0 auto;padding:14px 12px 40px}
button,textarea{font:inherit;color:inherit}
button{min-height:44px;border:0;border-radius:9px;padding:0 16px;background:var(--hover);cursor:pointer;font-weight:600}
button:active{filter:brightness(.92)}
button.flat{background:none}button.sug{background:var(--acc);color:var(--accfg)}
button.dng{color:var(--bad)}button.sm{min-height:36px;padding:0 12px;font-size:.9rem}
button:disabled{opacity:.4}
.card{background:var(--card);border-radius:12px;box-shadow:var(--sh);border:1px solid var(--line);padding:14px;margin-bottom:14px}
.list{background:var(--card);border-radius:12px;border:1px solid var(--line);overflow:hidden;margin-bottom:14px}
.row{display:flex;align-items:center;gap:8px;padding:10px 14px;border-top:1px solid var(--line)}.row:first-child{border-top:0}
.row .t{flex:1;min-width:0;cursor:pointer}.row .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dim{color:var(--dim);font-size:.85rem}
h2{font-size:.8rem;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);margin:18px 4px 8px}
textarea{width:100%;min-height:130px;border-radius:9px;border:1px solid var(--line);background:var(--bg);padding:10px;font-family:ui-monospace,monospace;font-size:.85rem}
.btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.btns>*{flex:1}
.opt{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);box-shadow:var(--sh);margin-bottom:8px;padding:11px 14px;font-weight:500;min-height:48px;white-space:pre-wrap}
.opt i{font-style:normal;font-weight:700;color:var(--dim);min-width:1.2em}
.opt.sel{border-color:var(--acc);box-shadow:inset 0 0 0 1px var(--acc)}
.opt.ok{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad)}
.q{font-size:1.1rem;font-weight:700;white-space:pre-wrap;margin:0 0 12px}
pre{background:var(--bg);border:1px solid var(--line);border-radius:9px;padding:10px;overflow-x:auto;font-size:.85rem;margin:0 0 12px}
.tw{overflow-x:auto;margin:0 0 12px}table{border-collapse:collapse;font-size:.9rem}
td,th{border:1px solid var(--line);padding:6px 10px;text-align:left}th{background:var(--hover)}
details{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px;margin-bottom:14px}
summary{font-weight:700;cursor:pointer}details>div{margin-top:8px;white-space:pre-wrap}
.ph{border:2px dashed var(--line);border-radius:9px;padding:10px;margin-bottom:12px;color:var(--dim)}.ph img,.img{max-width:100%;border-radius:9px;display:block;margin-bottom:8px}
.grid{display:flex;gap:6px;overflow-x:auto;padding:2px 2px 10px}
.chip{flex:none;min-width:38px;min-height:38px;padding:0 8px;border-radius:50%;border:1px solid var(--line);background:var(--card)}
.chip.done{background:var(--hover);color:var(--acc)}.chip.cur{background:var(--acc);color:var(--accfg);border-color:var(--acc)}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:10px}.bar div{height:100%;background:var(--acc)}
.exp{background:var(--hover);border-radius:9px;padding:10px;margin-top:6px;white-space:pre-wrap}
.warn{background:var(--badbg);border-radius:12px;padding:10px 14px;margin-bottom:14px}.warn li{margin-left:-6px}
.score{text-align:center;font-size:3rem;font-weight:800;color:var(--acc);margin:6px 0}
.seg{display:flex;background:var(--hover);border-radius:9px;padding:3px;margin-bottom:12px}.seg button{flex:1;min-height:36px;background:none}.seg .on{background:var(--card);box-shadow:var(--sh)}
.err{color:var(--bad);margin-top:8px;white-space:pre-wrap}
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:#2e3436;color:#fff;padding:10px 18px;border-radius:99px;z-index:20;display:none}
</style></head><body>
<div id="app"></div><div id="toast"></div>
<script>
// ---------- tiny DOM helper (text only, never innerHTML) ----------
const h=(t,a={},...c)=>{const e=document.createElement(t);for(const k in a){if(a[k]==null||a[k]===false)continue;if(k==='class')e.className=a[k];else if(k.startsWith('on'))e[k]=a[k];else e.setAttribute(k,a[k])}c.flat().forEach(x=>x!=null&&x!==false&&e.append(x));return e};
const $=document.getElementById.bind(document);
function toast(m){const t=$('toast');t.textContent=m;t.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>t.style.display='none',2500)}

// ---------- storage ----------
let S={quizzes:[]};
try{S=JSON.parse(localStorage.getItem('quizapp'))||S}catch(e){}
function save(){try{localStorage.setItem('quizapp',JSON.stringify(S));return true}catch(e){toast('Storage full or unavailable');return false}}
let cur=null,view='home',err='',draft='';

// ---------- parse + validate ----------
function parse(txt){
  txt=txt.trim().replace(/^```(?:json)?/i,'').replace(/```$/,'').trim();
  const a=txt.indexOf('{'),b=txt.lastIndexOf('}');if(a<0||b<0)throw'No JSON object found.';
  let d;try{d=JSON.parse(txt.slice(a,b+1))}catch(e){throw'Invalid JSON: '+e.message}
  if(!Array.isArray(d.questions)||!d.questions.length)throw'"questions" is missing or empty.'+(d.warnings&&d.warnings.length?'\nAI warnings: '+d.warnings.join('; '):'');
  d.passages=d.passages||[];d.warnings=d.warnings||[];d.title=d.title||'Untitled quiz';
  const pids=new Set(d.passages.map(p=>p.id));
  d.questions.forEach((q,i)=>{const n='Question '+(i+1);
    if(q.id==null)q.id=String(i+1);q.id=String(q.id);
    if(!q.question)throw n+': missing "question".';
    if(!q.options||typeof q.options!=='object'||Object.keys(q.options).length<2)throw n+': needs at least 2 options.';
    if(typeof q.answer==='string')q.answer=[q.answer];
    if(!Array.isArray(q.answer)||!q.answer.length||q.answer.some(l=>!(l in q.options)))throw n+': answer must be letters that exist in options.';
    if(q.passage_id&&!pids.has(q.passage_id))throw n+': passage_id "'+q.passage_id+'" does not exist.'});
  return d}
function addQuiz(d){const q={uid:Date.now()+'',data:d,ans:{},fix:{},conf:{},imgs:{},idx:0,mode:'instant',done:false,ids:d.questions.map(x=>x.id)};S.quizzes.unshift(q);save();return q}

// ---------- helpers ----------
const Q=(q,id)=>q.data.questions.find(x=>x.id===id);
const right=(q,x)=>q.fix[x.id]||x.answer;
const same=(a,b)=>a&&a.length===b.length&&a.every(v=>b.includes(v));
const answered=(q,x)=>(x.answer.length>1||(q.fix[x.id]&&q.fix[x.id].length>1))?q.conf[x.id]:(q.ans[x.id]||[]).length>0;
const isMulti=(q,x)=>right(q,x).length>1;

function render(){
  const app=$('app');app.replaceChildren();
  if(view==='home')home(app);else if(view==='quiz')quiz(app);else results(app);
  window.scrollTo(0,0)}
function header(title,left,right){return h('header',{},left||h('div',{style:'width:44px'}),h('h1',{},title),right||h('div',{style:'width:44px'}))}

// ---------- home ----------
function home(app){
  app.append(header('Quizzes'));
  const ta=h('textarea',{placeholder:'Paste the JSON from your AI here…',value:''});ta.value=draft;ta.oninput=()=>draft=ta.value;
  const m=h('main',{},
    h('h2',{},'New quiz'),
    h('div',{class:'card'},ta,err&&h('div',{class:'err'},err),
      h('div',{class:'btns'},h('button',{class:'sug',onclick:()=>{try{const q=addQuiz(parse(ta.value));draft='';err='';open(q)}catch(e){err=String(e);render()}}},'Load quiz'),
        h('button',{onclick:()=>{ta.value=draft=JSON.stringify(SAMPLE,null,1);}},'Load sample'))));
  if(S.quizzes.length){const l=h('div',{class:'list'});
    S.quizzes.forEach(q=>{const n=q.data.questions.length,a=Object.keys(q.ans).length;
      l.append(h('div',{class:'row'},h('div',{class:'t',onclick:()=>open(q)},h('b',{},q.data.title),h('span',{class:'dim'},n+' questions · '+(q.done?'finished':a+' answered'))),
        h('button',{class:'flat sm',title:'Rename',onclick:()=>{const t=prompt('Rename',q.data.title);if(t){q.data.title=t;save();render()}}},'✎'),
        h('button',{class:'flat sm',title:'Copy JSON',onclick:()=>{navigator.clipboard.writeText(JSON.stringify(q.data)).then(()=>toast('JSON copied'),()=>toast('Copy failed'))}},'⧉'),
        h('button',{class:'flat sm dng',title:'Delete',onclick:()=>{if(confirm('Delete this quiz?')){S.quizzes=S.quizzes.filter(z=>z!==q);save();render()}}},'🗑')))});
    m.append(h('h2',{},'Saved'),l)}
  app.append(m)}
function open(q){cur=q;view=q.done?'results':'quiz';render()}

// ---------- quiz ----------
function showTable(t){if(!t||!t.headers)return null;return h('div',{class:'tw'},h('table',{},h('thead',{},h('tr',{},t.headers.map(x=>h('th',{},String(x))))),h('tbody',{},(t.rows||[]).map(r=>h('tr',{},r.map(c=>h('td',{},String(c))))))))}
function showImg(q,key,im){if(!im)return null;const src=q.imgs[key];
  const inp=h('input',{type:'file',accept:'image/*',style:'display:none'});
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{const i=new Image();i.onload=()=>{const s=Math.min(1,800/i.width),c=document.createElement('canvas');c.width=i.width*s;c.height=i.height*s;c.getContext('2d').drawImage(i,0,0,c.width,c.height);q.imgs[key]=c.toDataURL('image/jpeg',.7);if(!save())delete q.imgs[key];render()};i.src=r.result};r.readAsDataURL(f)};
  return h('div',{class:'ph'},src&&h('img',{src}),!src&&h('div',{},'🖼 Image: '+(im.description||'')),inp,
    h('div',{class:'btns'},h('button',{class:'sm',onclick:()=>inp.click()},src?'Replace photo':'Attach photo'),src&&h('button',{class:'sm dng',onclick:()=>{delete q.imgs[key];save();render()}},'Remove')))}
function block(q,o,key){return[o.title&&h('div',{class:'q'},o.title),o.text&&h('div',{style:'white-space:pre-wrap;margin-bottom:12px'},o.text),showTable(o.table),showImg(q,key,o.image)]}

function quiz(app){
  const q=cur,ids=q.ids,x=Q(q,ids[q.idx]),w=q.data.warnings;
  app.append(header(q.data.title,h('button',{class:'flat',onclick:()=>{view='home';render()}},'‹'),
    w.length?h('button',{class:'flat',onclick:()=>alert(w.join('\n\n'))},'⚠ '+w.length):null));
  const m=h('main');
  m.append(h('div',{class:'bar'},h('div',{style:'width:'+(q.idx+1)/ids.length*100+'%'})));
  const g=h('div',{class:'grid'});
  ids.forEach((id,i)=>{const y=Q(q,id);g.append(h('button',{class:'chip'+(i===q.idx?' cur':answered(q,y)?' done':''),onclick:()=>{q.idx=i;save();render()}},String(i+1)))});m.append(g);
  m.append(h('div',{class:'seg'},['instant','exam'].map(k=>h('button',{class:q.mode===k?'on':'',onclick:()=>{q.mode=k;save();render()}},k==='instant'?'Instant feedback':'Exam mode'))));
  if(x.passage_id){const p=q.data.passages.find(p=>p.id===x.passage_id);m.append(h('details',{open:''},h('summary',{},p.title||'Passage'),h('div',{},block(q,{text:p.text,table:p.table,image:p.image},'p:'+p.id))))}
  const c=h('div',{class:'card'});
  c.append(h('div',{class:'dim'},'Question '+x.id+(isMulti(q,x)?' · select all that apply':'')),h('p',{class:'q'},x.question));
  if(x.code)c.append(h('pre',{},x.code));c.append(showTable(x.table),showImg(q,'q:'+x.id,x.image));
  const sel=q.ans[x.id]||[],fb=q.mode==='instant'&&answered(q,x),R=right(q,x);
  Object.keys(x.options).forEach(l=>{
    let cl='opt';if(sel.includes(l))cl+=' sel';if(fb){if(R.includes(l))cl+=' ok';else if(sel.includes(l))cl+=' bad'}
    c.append(h('button',{class:cl,disabled:fb?'':null,onclick:()=>{
      if(isMulti(q,x)){q.ans[x.id]=sel.includes(l)?sel.filter(v=>v!==l):[...sel,l];delete q.conf[x.id]}else q.ans[x.id]=[l];
      save();render()}},h('i',{},l.toUpperCase()),x.options[l]))});
  if(isMulti(q,x)&&!fb)c.append(h('button',{class:'sug',style:'width:100%',disabled:sel.length?null:'',onclick:()=>{q.conf[x.id]=true;save();render()}},'Confirm'));
  if(fb){c.append(h('div',{class:same(sel,R)?'dim':'err'},same(sel,R)?'✓ Correct':'✗ Correct answer: '+R.map(v=>v.toUpperCase()).join(', ')));
    if(x.explanation)c.append(h('div',{class:'exp'},x.explanation));c.append(fixer(q,x))}
  m.append(c);
  const last=q.idx===ids.length-1;
  m.append(h('div',{class:'btns'},h('button',{disabled:q.idx?null:'',onclick:()=>{q.idx--;save();render()}},'Back'),
    h('button',{class:'sug',onclick:()=>{if(last){q.done=true;save();view='results';render()}else{q.idx++;save();render()}}},last?'Finish':'Next')));
  app.append(m)}

// change the correct answer (fix wrong AI answers)
function fixer(q,x){const d=h('details',{style:'margin:10px 0 0;padding:6px 12px'},h('summary',{class:'dim'},'Change correct answer'));
  const row=h('div',{class:'btns'});let pick=[...right(q,x)];
  Object.keys(x.options).forEach(l=>{const b=h('button',{class:'sm'+(pick.includes(l)?' sug':''),onclick:()=>{pick=pick.includes(l)?pick.filter(v=>v!==l):[...pick,l];b.className='sm'+(pick.includes(l)?' sug':'')}},l.toUpperCase());row.append(b)});
  row.append(h('button',{class:'sm sug',onclick:()=>{if(!pick.length)return;q.fix[x.id]=pick;save();render()}},'Save'));d.append(row);return d}

// ---------- results ----------
function results(app){
  const q=cur,all=q.ids.map(id=>Q(q,id)),wrong=all.filter(x=>!same(q.ans[x.id]||[],right(q,x))),score=all.length-wrong.length;
  app.append(header('Results',h('button',{class:'flat',onclick:()=>{view='home';render()}},'‹')));
  const sh=h('input',{type:'checkbox'});
  const start=ids=>{if(sh.checked)ids=[...ids].sort(()=>Math.random()-.5);ids.forEach(id=>{delete q.ans[id];delete q.conf[id]});q.ids=ids;q.idx=0;q.done=false;save();view='quiz';render()};
  const m=h('main',{},h('div',{class:'card'},h('div',{class:'score'},score+' / '+all.length),h('div',{class:'dim',style:'text-align:center'},Math.round(score/all.length*100)+'% correct'),
    h('div',{class:'btns'},wrong.length&&h('button',{class:'sug',onclick:()=>start(wrong.map(x=>x.id))},'Retry wrong only'),h('button',{onclick:()=>start(q.data.questions.map(x=>x.id))},'Retry all')),
    h('label',{class:'dim',style:'display:block;margin-top:10px'},sh,' Shuffle questions')));
  if(wrong.length){m.append(h('h2',{},'Wrong answers'));
    wrong.forEach(x=>{const mine=q.ans[x.id]||[],R=right(q,x);
      m.append(h('div',{class:'card'},h('div',{class:'dim'},'Question '+x.id),h('p',{class:'q'},x.question),
        h('div',{},'Yours: ',mine.length?mine.map(l=>l.toUpperCase()+'. '+x.options[l]).join('; '):'(no answer)'),
        h('div',{style:'color:var(--ok);font-weight:600'},'Correct: '+R.map(l=>l.toUpperCase()+'. '+x.options[l]).join('; ')),
        x.explanation&&h('div',{class:'exp'},x.explanation),fixer(q,x)))})}
  else m.append(h('div',{class:'card',style:'text-align:center'},'🎉 Perfect score!'));
  app.append(m)}

// ---------- sample ----------
const SAMPLE={title:"Sample quiz",source:"generated",passages:[{id:"p1",title:"The Fox",text:"A quick fox saw a grape vine.\nThe grapes were too high, so the fox left.",table:null,image:null}],
questions:[
{id:"1",passage_id:"p1",question:"Why did the fox leave?",options:{a:"It was full",b:"Grapes were too high",c:"It was scared",d:"It was night"},answer:["b"],explanation:"The text says the grapes were too high."},
{id:"2",passage_id:"p1",question:"What did the fox see?",options:{a:"A grape vine",b:"A river",c:"A hen",d:"A farmer"},answer:["a"],explanation:"First sentence."},
{id:"3",passage_id:null,question:"Using the table, which fruit is the most expensive?",table:{headers:["Fruit","Price"],rows:[["Apple","2"],["Mango","5"],["Grape","3"]]},options:{a:"Apple",b:"Mango",c:"Grape",d:"All equal"},answer:["b"],explanation:"Mango costs 5."},
{id:"4",passage_id:null,question:"What does this print?",code:"for i in range(3):\n    print(i)",options:{a:"1 2 3",b:"0 1 2",c:"0 1 2 3",d:"Error"},answer:["b"],explanation:"range(3) gives 0,1,2."},
{id:"5",passage_id:null,question:"Look at the diagram. Which shapes are triangles?",image:{description:"A diagram with a circle (A), triangle (B), square (C) and another triangle (D)."},options:{a:"A",b:"B",c:"C",d:"D"},answer:["b","d"],explanation:"B and D are triangles."}],
warnings:["Q5: has an image, check the original"]};
// ===== v2: rounds, weighted repeats, no skipping (overrides older functions above) =====
const pct=q=>{const s=q.st||{};return Math.round(q.data.questions.filter(x=>s[x.id]>0).length/q.data.questions.length*100)};
function pickIds(q){const s=q.st||{},pool=[...q.data.questions],out=[],n=q.size||10;
  while(out.length<n&&pool.length){const w=pool.map(x=>1/(1+(s[x.id]||0)));let r=Math.random()*w.reduce((a,b)=>a+b,0),i=0;while(i<pool.length-1&&(r-=w[i])>0)i++;out.push(pool.splice(i,1)[0].id)}return out}
function startRound(q){q.st=q.st||{};q.round={ids:pickIds(q),i:0,ans:{}};save();view='quiz';render()}
function open(q){cur=q;view=q.round?'quiz':'qhome';render()}
function render(){const app=$('app');app.replaceChildren();({home,qhome,quiz,review,settings})[view](app);window.scrollTo(0,0)}
const bar=p=>h('div',{class:'bar'},h('div',{style:'width:'+p+'%'}));

function home(app){
  app.append(header('Quizzes'));
  const ta=h('textarea',{placeholder:'Paste the JSON from your AI here…'});ta.value=draft;ta.oninput=()=>draft=ta.value;
  const m=h('main',{},h('h2',{},'New quiz'),h('div',{class:'card'},ta,err&&h('div',{class:'err'},err),
    h('div',{class:'btns'},h('button',{class:'sug',onclick:()=>{try{const q=addQuiz(parse(ta.value));draft='';err='';open(q)}catch(e){err=String(e);render()}}},'Load quiz'),
      h('button',{onclick:()=>{ta.value=draft=JSON.stringify(SAMPLE,null,1)}},'Load sample'))));
  if(S.quizzes.length){const l=h('div',{class:'list'});
    S.quizzes.forEach(q=>l.append(h('div',{class:'row'},h('div',{class:'t',onclick:()=>open(q)},h('b',{},q.data.title),h('span',{class:'dim'},q.data.questions.length+' questions · '+pct(q)+'% mastered')),
      h('button',{class:'flat sm',title:'Settings',onclick:()=>{cur=q;view='settings';render()}},'⚙'))));
    m.append(h('h2',{},'Saved'),l)}
  app.append(m)}

function qhome(app){const q=cur,p=pct(q);
  app.append(header(q.data.title,h('button',{class:'flat',onclick:()=>{view='home';render()}},'‹'),h('button',{class:'flat',onclick:()=>{view='settings';render()}},'⚙')));
  app.append(h('main',{},h('div',{class:'card'},h('div',{class:'score'},p+'%'),bar(p),
    h('div',{class:'dim',style:'text-align:center'},p===100?'🎉 Every question answered correctly!':'Answer every question correctly at least once to reach 100%'),
    h('div',{class:'btns'},h('button',{class:'sug',onclick:()=>startRound(q)},'Start round ('+Math.min(q.size||10,q.data.questions.length)+' questions)')))))}

function quiz(app){const q=cur,r=q.round,x=Q(q,r.ids[r.i]),sel=r.ans[x.id]||[],multi=right(q,x).length>1,last=r.i===r.ids.length-1;
  app.append(header('Question '+(r.i+1)+' / '+r.ids.length,h('button',{class:'flat',onclick:()=>{if(confirm('Quit this round? It will NOT be counted.')){q.round=null;save();view='qhome';render()}}},'✕')));
  const m=h('main',{},bar((r.i)/r.ids.length*100));
  if(x.passage_id){const p=q.data.passages.find(p=>p.id===x.passage_id);m.append(h('details',{open:''},h('summary',{},p.title||'Passage'),h('div',{},block(q,{text:p.text,table:p.table,image:p.image},'p:'+p.id))))}
  const c=h('div',{class:'card'},multi&&h('div',{class:'dim'},'Select all that apply'),h('p',{class:'q'},x.question));
  if(x.code)c.append(h('pre',{},x.code));c.append(showTable(x.table),showImg(q,'q:'+x.id,x.image));
  Object.keys(x.options).forEach(l=>c.append(h('button',{class:'opt'+(sel.includes(l)?' sel':''),onclick:()=>{r.ans[x.id]=multi?(sel.includes(l)?sel.filter(v=>v!==l):[...sel,l]):[l];save();render()}},h('i',{},l.toUpperCase()),x.options[l])));
  m.append(c,h('button',{class:'sug',style:'width:100%',disabled:sel.length?null:'',onclick:()=>{if(last)finish(q);else{r.i++;save();render()}}},last?'Finish round':'Next'));
  app.append(m)}

function finish(q){const r=q.round,res={};q.st=q.st||{};
  r.ids.forEach(id=>{const ok=same(r.ans[id]||[],right(q,Q(q,id)));res[id]=ok;if(ok)q.st[id]=(q.st[id]||0)+1});
  q.last={ids:r.ids,ans:r.ans,res};q.round=null;save();view='review';render()}

function fixer2(q,x){const d=h('details',{style:'margin:10px 0 0;padding:6px 12px'},h('summary',{class:'dim'},'Change correct answer')),row=h('div',{class:'btns'});let sel=[...right(q,x)];
  Object.keys(x.options).forEach(l=>{const b=h('button',{class:'sm'+(sel.includes(l)?' sug':''),onclick:()=>{sel=sel.includes(l)?sel.filter(v=>v!==l):[...sel,l];b.className='sm'+(sel.includes(l)?' sug':'')}},l.toUpperCase());row.append(b)});
  row.append(h('button',{class:'sm sug',onclick:()=>{if(!sel.length)return;q.fix[x.id]=sel;
    if(q.last&&x.id in q.last.res){const ok=same(q.last.ans[x.id]||[],sel);if(ok!==q.last.res[x.id]){q.st[x.id]=Math.max(0,(q.st[x.id]||0)+(ok?1:-1));q.last.res[x.id]=ok}}
    save();render()}},'Save'));d.append(row);return d}
const ansTxt=(x,a)=>a&&a.length?a.map(l=>l.toUpperCase()+'. '+x.options[l]).join('; '):'(no answer)';

function review(app){const q=cur,L=q.last,n=L.ids.length,good=L.ids.filter(id=>L.res[id]).length;
  app.append(header('Round result',h('button',{class:'flat',onclick:()=>{view='qhome';render()}},'‹')));
  const m=h('main',{},h('div',{class:'card'},h('div',{class:'score'},good+' / '+n),h('div',{class:'dim',style:'text-align:center'},'Overall progress: '+pct(q)+'%'),bar(pct(q)),
    h('div',{class:'btns'},h('button',{class:'sug',onclick:()=>startRound(q)},'Next round'),h('button',{onclick:()=>{view='qhome';render()}},'Done'))));
  L.ids.forEach(id=>{const x=Q(q,id),ok=L.res[id];
    m.append(h('div',{class:'card',style:'border-left:4px solid var(--'+(ok?'ok':'bad')+')'},h('div',{class:'dim'},(ok?'✓ Correct':'✗ Wrong')+' · Question '+x.id),h('p',{class:'q'},x.question),
      x.code&&h('pre',{},x.code),
      h('div',{style:'color:var(--'+(ok?'ok':'bad')+')'},'Yours: '+ansTxt(x,L.ans[id])),
      !ok&&h('div',{style:'color:var(--ok);font-weight:600'},'Correct: '+ansTxt(x,right(q,x))),
      x.explanation&&h('div',{class:'exp'},x.explanation),fixer2(q,x)))});
  app.append(m)}

function settings(app){const q=cur;
  app.append(header('Settings',h('button',{class:'flat',onclick:()=>{view=q.round?'quiz':'qhome';render()}},'‹')));
  const sz=h('input',{type:'number',min:1,max:50,value:String(q.size||10),style:'width:70px;font:inherit;padding:6px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:inherit'});
  sz.onchange=()=>{q.size=Math.max(1,Math.min(50,+sz.value||10));save();toast('Saved')};
  const m=h('main',{},h('div',{class:'list'},
    h('div',{class:'row'},h('div',{class:'t'},h('b',{},'Questions per round')),sz),
    h('div',{class:'row'},h('div',{class:'t',onclick:()=>{const t=prompt('Rename',q.data.title);if(t){q.data.title=t;save();render()}}},h('b',{},'Rename quiz'),h('span',{class:'dim'},q.data.title))),
    h('div',{class:'row'},h('div',{class:'t',onclick:()=>{navigator.clipboard.writeText(JSON.stringify(q.data)).then(()=>toast('JSON copied'),()=>toast('Copy failed'))}},h('b',{},'Copy quiz JSON'))),
    h('div',{class:'row'},h('div',{class:'t',onclick:()=>{if(confirm('Reset all progress for this quiz?')){q.st={};q.round=null;q.last=null;save();view='qhome';render()}}},h('b',{style:'color:var(--bad)'},'Reset progress'))),
    h('div',{class:'row'},h('div',{class:'t',onclick:()=>{if(confirm('Delete this quiz?')){S.quizzes=S.quizzes.filter(z=>z!==q);save();view='home';render()}}},h('b',{style:'color:var(--bad)'},'Delete quiz')))));
  if(q.data.warnings.length)m.append(h('div',{class:'warn'},h('b',{},'AI warnings'),h('ul',{},q.data.warnings.map(w=>h('li',{},w)))));
  if(q.round)m.append(h('div',{class:'dim'},'Answers are hidden during a round.'));
  else{const d=h('details',{},h('summary',{},'All correct answers ('+q.data.questions.length+')'));
    q.data.questions.forEach(x=>d.append(h('div',{style:'border-top:1px solid var(--line);padding:10px 0'},h('b',{},x.id+'. '+x.question),h('div',{style:'color:var(--ok)'},ansTxt(x,right(q,x))),x.explanation&&h('div',{class:'dim'},x.explanation),fixer2(q,x))));
    m.append(d)}
  app.append(m)}
render();
</script></body></html>
